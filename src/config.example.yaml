# immich-shared-albums configuration
immich:
  url: http://immich-server:2283
  api_key: ${SIDECAR_API_KEY}

household:
  name: "The Smith household"
  public_url: https://photos.example.com   # must be reachable by peer households

mirrors:
  album_name_template: "🔗 {name}"          # how shared albums appear in stock apps
  utility_user_template: "Shared · {contributor}"
  poll_interval_seconds: 120                # watcher cadence for album changes

modules:
  share_page_banner: true      # inject join banner on /share/* (requires Caddy route)
  originals_proxy: true        # serve true originals for proxy assets (requires Caddy route)
  nav_link_graft: false        # inject "Shared households" into the web admin sidebar
  search_join_hack: false      # EXPERIMENTAL: paste an invite link into the app's search bar

security:
  require_contributor_approval: false   # true = new households need a panel approval
