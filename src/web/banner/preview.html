<!doctype html>
<!-- Local preview: open this file in a browser to judge the banner over a faux share page. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banner preview — immich-shared-albums</title>
<style>
  body { margin: 0; font-family: Inter, -apple-system, sans-serif; background: #101216; color: #e5e7eb; }
  header { padding: 14px 20px; background: #1f2229; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; padding: 4px; }
  .ph { aspect-ratio: 1; background: linear-gradient(135deg, hsl(calc(var(--i) * 37), 30%, 28%), hsl(calc(var(--i) * 61), 25%, 18%)); }
</style>
</head>
<body>
<header>Family Wedding — shared album (faux page)</header>
<div class="grid">
  <script>for (let i = 0; i < 24; i++) document.write(`<div class="ph" style="--i:${i}"></div>`)</script>
</div>
<script>history.replaceState({}, '', location.href.split('?')[0] + '?'); Object.defineProperty(window,'__preview',{value:true});</script>
<script>
  // simulate the /share/<key> path for the banner's key extraction
  const orig = location.pathname;
  history.replaceState({}, '', '/share/PREVIEWKEY123');
  window.addEventListener('load', () => history.replaceState({}, '', orig));
</script>
<script src="banner.js"></script>
</body>
</html>
