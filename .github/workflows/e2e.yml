name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly: catch breakage in immich-server:release before users do
  workflow_dispatch:
    inputs:
      isa_sync_poll_ms:
        description: 'Sidecar cadence in ms, for a timing experiment (default: 1000)'
        required: false
        default: '1000'
      fail_fast:
        description: "Stop at the end of the first failing stage ('1', the default) or run every stage ('0') to see the full failure pattern"
        required: false
        default: '1'

jobs:
  pr-title:
    # The squashed PR title is what release-please parses. See ../../AGENTS.md ("How changes land").
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must be conventional (feat:/fix:/chore:/…) — it becomes the release commit"; exit 1; }
  # Its own job, not a step in e2e: a lint failure should report as "checks", not as a
  # confusing e2e failure, and it finishes in ~1 minute instead of waiting on Immich to boot.
  # Worth marking as a required status check in branch protection alongside e2e.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --silent
      - name: Formatting (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Import cycles
        run: npm run cycles
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # push/PR runs pin the known-good Immich BY DIGEST (upstream mutates even version
      # tags — observed live 2026-08-16); the weekly cron chases :release as a canary
      IMMICH_REF: ${{ github.event_name == 'schedule' && ':release' || '@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb' }}
      # Sidecar cadence, read by both the rig (compose) and the suite (its `stable()` holds are
      # derived from it). A dispatch input makes a cadence experiment one button, so its runs carry
      # the same commit and the only variable is the cadence.
      ISA_SYNC_POLL_MS: ${{ inputs.isa_sync_poll_ms || vars.ISA_SYNC_POLL_MS || '1000' }}
      # Stop at the end of the first failing stage: a red run costs ~4 minutes, not ~12, and the
      # stages after a failure mostly describe its fallout. Dispatch with fail_fast=0 when the full
      # failure pattern is the evidence you need.
      E2E_FAIL_FAST: ${{ inputs.fail_fast || '1' }}
    steps:
      - uses: actions/checkout@v4

      # Work that needs only the checkout starts here and runs UNDER the ~50s Immich boot instead
      # of after it: the sidecar image build and the browser tooling install. Each writes its exit
      # code to a file when done; the step that needs the result waits on that file, so a failure
      # still fails the run — it just no longer costs its own wall clock.
      - name: Start background work (sidecar image build, browser tooling)
        run: |
          mkdir -p /tmp/bg
          ( docker build -q -t immich-shared-albums:demo . > /tmp/bg/build.log 2>&1; echo $? > /tmp/bg/build.rc ) &
          ( cd demo/e2e && npm install --silent && npx playwright install --with-deps chromium; echo $? > /tmp/bg/playwright.rc ) > /tmp/bg/playwright.log 2>&1 &
          echo "started"

      - name: Start mock Immich instances (B + C + D)
        run: |
          echo "B_API_KEY=placeholder" > demo/.env
          echo "C_API_KEY=placeholder" > demo/household-c/.env
          echo "D_API_KEY=placeholder" > demo/household-d/.env
          # pre-pull everything with retries — runners share registry rate limits
          # (Docker Hub anonymous quota AND ghcr per-minute throttles). The three pulls are
          # independent, so they run at once; the wall is the slowest pull, not their sum.
          pull() { for i in 1 2 3 4 5 6; do docker pull "$1" && return 0; echo "pull $1 throttled, retrying"; sleep 30; done; return 1; }
          pull valkey/valkey:8 & p1=$!
          pull "ghcr.io/immich-app/immich-server${IMMICH_REF:-:release}" & p2=$!
          pull ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 & p3=$!
          wait $p1 && wait $p2 && wait $p3
          (cd demo && docker compose up -d immich-b db-b redis-b)
          (cd demo/household-c && docker compose up -d immich-c db-c redis-c)
          (cd demo/household-d && docker compose up -d immich-d db-d redis-d)

      - name: Provision admins + API keys
        run: |
          chmod +x demo/ci/provision-mock.sh
          echo "B_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2284 'Demo Nan')" > demo/.env
          echo "B_SIDECAR_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2284 'Demo Nan' --scoped)" >> demo/.env
          echo "C_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2285 'Grandpa Joe')" > demo/household-c/.env
          echo "C_SIDECAR_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2285 'Grandpa Joe' --scoped)" >> demo/household-c/.env
          echo "D_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2286 'Demo Dave')" > demo/household-d/.env
          echo "D_SIDECAR_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2286 'Demo Dave' --scoped)" >> demo/household-d/.env

      - name: Recycle Immich (DB pools born mid-migration serialize enums wrongly on slow stacks)
        run: |
          # Three independent stacks: restart them together, then wait for all three to answer.
          (cd demo && docker compose restart immich-b) &
          (cd demo/household-c && docker compose restart immich-c) &
          (cd demo/household-d && docker compose restart immich-d) &
          wait
          for p in 2284 2285 2286; do
            for i in $(seq 1 60); do curl -sf http://localhost:$p/api/server/ping >/dev/null && break; sleep 2; done
          done

      - name: Run E2E suite
        run: |
          # The image was built in the background at the start of the job; a failed build fails
          # here, loudly, instead of the rig quietly testing whatever image was lying around.
          until [ -f /tmp/bg/build.rc ]; do sleep 1; done
          if [ "$(cat /tmp/bg/build.rc)" != "0" ]; then cat /tmp/bg/build.log; echo "::error::sidecar image build failed"; exit 1; fi
          echo "sidecar image: $(docker images -q immich-shared-albums:demo)"
          SKIP_BUILD=1 bash demo/run-mock-e2e.sh

      - name: Browser tests (banner + accept flows)
        run: |
          # one hostname that works for the runner's browser AND inside containers
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          # Browser tooling was installed in the background at the start of the job.
          until [ -f /tmp/bg/playwright.rc ]; do sleep 1; done
          if [ "$(cat /tmp/bg/playwright.rc)" != "0" ]; then cat /tmp/bg/playwright.log; echo "::error::browser tooling install failed"; exit 1; fi
          cd demo/e2e
          CKEY=$(grep -m1 C_API_KEY ../household-c/.env | cut -d= -f2-) \
          B_EMAIL=admin@e2e.local B_PASS=e2e-admin-pass-1 node browser-test.mjs

      # Informational, every run: a faster cadence must not be bought with API strain. Counts, not a gate.
      - name: Sidecar API strain (429/5xx in sidecar logs)
        if: always()
        run: |
          for d in demo demo/household-c demo/household-d; do
            n=$(cd "$d" && docker compose logs --no-log-prefix 2>/dev/null | grep -cE "( 429 | 5[0-9]{2} |status 429|status 5[0-9]{2}|failed: 429|failed: 5[0-9]{2})" || true)
            echo "$d: ${n:-0} line(s) mentioning 429/5xx"
          done

      - name: Dump sidecar logs on failure
        if: failure()
        run: |
          (cd demo && docker compose logs sidecar-b --tail 200) || true
          (cd demo/household-c && docker compose logs sidecar-c --tail 200) || true
          (cd demo/household-d && docker compose logs sidecar-d --tail 200) || true
          (cd demo && docker compose logs immich-b --tail 150) || true
          (cd demo/household-c && docker compose logs immich-c --tail 150) || true
