# .github/workflows/codeql.yml — CodeQL code scanning over src. See AGENTS.md ("How changes land").
#
# Free on public repositories. Advisory, like CodeRabbit: deliberately NOT a required status check,
# so a finding can never block a merge that CI passed.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Not Monday 06:00 — e2e.yml already owns that slot as its Immich :release canary.
    - cron: '0 6 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # Generated output is not source — the same two paths .coderabbit.yaml excludes, so the
          # committed bundles cannot produce findings nobody can act on. security-extended over the
          # default suite, because this addon holds household keys and speaks its own wire protocol.
          config: |
            paths-ignore:
              - src/web/dist
              - '**/*.bundle.js'
            queries:
              - uses: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
