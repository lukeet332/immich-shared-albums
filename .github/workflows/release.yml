name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMMICH_REF: '@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb'
    steps:
      - uses: actions/checkout@v4

      # the full E2E suite gates every release
      - name: Start mock Immich instances (B + C + D)
        run: |
          echo "B_API_KEY=placeholder" > demo/.env
          echo "C_API_KEY=placeholder" > demo/household-c/.env
          echo "D_API_KEY=placeholder" > demo/household-d/.env
          # pre-pull everything with retries — runners share registry rate limits
          # (Docker Hub anonymous quota AND ghcr per-minute throttles)
          pull() { for i in 1 2 3 4 5 6; do docker pull "$1" && return 0; echo "pull $1 throttled, retrying"; sleep 30; done; return 1; }
          pull valkey/valkey:8
          pull "ghcr.io/immich-app/immich-server${IMMICH_REF:-:release}"
          pull ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          (cd demo && docker compose up -d immich-b db-b redis-b)
          (cd demo/household-c && docker compose up -d immich-c db-c redis-c)
          (cd demo/household-d && docker compose up -d immich-d db-d redis-d)
      - name: Provision admins + API keys
        run: |
          chmod +x demo/ci/provision-mock.sh
          echo "B_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2284 'Demo Nan')" > demo/.env
          echo "C_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2285 'Grandpa Joe')" > demo/household-c/.env
          echo "D_API_KEY=$(demo/ci/provision-mock.sh http://localhost:2286 'Demo Dave')" > demo/household-d/.env
      - name: Recycle Immich (DB pools born mid-migration serialize enums wrongly on slow stacks)
        run: |
          (cd demo && docker compose restart immich-b)
          (cd demo/household-c && docker compose restart immich-c)
          (cd demo/household-d && docker compose restart immich-d)
          for p in 2284 2285 2286; do
            for i in $(seq 1 60); do curl -sf http://localhost:$p/api/server/ping >/dev/null && break; sleep 2; done
          done

      - name: Run E2E suite
        run: bash demo/run-mock-e2e.sh

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build + push multi-arch image (amd64 + arm64 — Pi-friendly)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      # release-please owns the tag, the changelog and the GitHub release. This job runs
      # on the tag it just pushed, so the release normally exists by the time we get here
      # — creating it again is a 422, which is what failed v0.1.0, v0.4.0 and v0.5.0.
      # Only create one if release-please didn't (it occasionally loses to a 503), and
      # let it write the notes: it generates them from the changelog entry it authored.
      - name: Ensure a GitHub Release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created by release-please) — nothing to do."
          else
            echo "No release found for $TAG — creating one as a fallback."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
