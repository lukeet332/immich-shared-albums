name: release-please

# Versioning is decided by conventional commits, not by hand:
# feat: -> minor, fix: -> patch, feat!/BREAKING CHANGE -> major.
# On every push to main this maintains a release PR (version bump + changelog + config.ts);
# merging that PR creates the GitHub Release and its tag, and the tag triggers the suite-gated
# build (release.yml). If the tag is missing afterwards, push it by hand: `git tag vX.Y.Z
# <release-sha> && git push origin vX.Y.Z` — the image ships on the tag, not on the merge.
# `last-release-sha` in release-please-config.json pins the commit release-please measures from:
# the merged-but-reverted `chore(main): release 1.0.0` PR (#30) cannot be deleted, so without it
# every run re-derives that release and fails on the reserved tag. Remove the pin once a release
# PR created by it has merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # PAT (not GITHUB_TOKEN) so the release PR triggers the e2e check
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
