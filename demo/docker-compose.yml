# Household B — a complete mock household for the demo: mini Immich + sidecar.
name: household-b
services:
  immich-b:
    image: ghcr.io/immich-app/immich-server${IMMICH_REF:-:release}
    environment:
      DB_HOSTNAME: db-b
      DB_USERNAME: postgres
      DB_PASSWORD: demo
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis-b
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    volumes:
      - ./b-library:/data
    ports:
      - 2284:2283
    depends_on: [db-b, redis-b]
    restart: unless-stopped

  db-b:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: immich
    volumes:
      - ./b-pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis-b:
    image: valkey/valkey:8
    restart: unless-stopped

  sidecar-b:
    image: immich-shared-albums:demo
    # rig-only: the suite reads state.db from the host and purges via docker exec,
    # so the test sidecars keep running as root instead of the image's node user
    user: "0:0"
    # LAN address when testing from a phone.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ISA_IMMICH_URL: http://immich-b:2283
      ISA_IMMICH_API_KEY: ${B_SIDECAR_API_KEY:-${B_API_KEY}}
      ISA_HOUSEHOLD_NAME: "Demo household (B)"
      ISA_SYNC_POLL_MS: "15000"
    networks:
      - default
      - isa-demo
    volumes:
      - ./b-sidecar:/data
    ports:
      - 8301:8300
    restart: unless-stopped

# iroh direct addresses are container IPs; one shared network makes them route across the rig
networks:
  isa-demo:
    external: true
