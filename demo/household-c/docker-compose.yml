# Household C — second throwaway mock so E2E runs mock↔mock, never touching production A.
name: household-c
services:
  immich-c:
    image: ghcr.io/immich-app/immich-server${IMMICH_REF:-:release}
    environment:
      DB_HOSTNAME: db-c
      DB_USERNAME: postgres
      DB_PASSWORD: demo
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis-c
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    volumes:
      - ./c-library:/data
    ports:
      - 2285:2283
    depends_on: [db-c, redis-c]
    restart: unless-stopped
  db-c:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: immich
    volumes:
      - ./c-pg:/var/lib/postgresql/data
    restart: unless-stopped
  redis-c:
    image: valkey/valkey:8
    restart: unless-stopped
  sidecar-c:
    image: immich-shared-albums:demo
    # LAN address when testing from a phone.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      IMMICH_URL: http://immich-c:2283
      IMMICH_API_KEY: ${C_SIDECAR_API_KEY:-${C_API_KEY}}
      HOUSEHOLD_NAME: "Mock household (C)"
      POLL_MS: "8000"
    networks:
      - default
      - isa-demo
    volumes:
      - ./c-sidecar:/data
    ports:
      - 8302:8300
    restart: unless-stopped

# iroh direct addresses are container IPs; one shared network makes them route across the rig
networks:
  isa-demo:
    external: true
