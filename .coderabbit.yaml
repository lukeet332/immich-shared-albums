# CodeRabbit config — advisory PR review only. See AGENTS.md ("How changes land").
#
# The conventions themselves are NOT restated here: AGENTS.md is ingested verbatim through
# knowledge_base.code_guidelines, so `path_instructions` below covers only how to review this
# repo, never what its rules are. One source of truth, so the two cannot drift.
# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: chill # `quiet` is the dial if reviews turn out noisy.

  # Must stay false. A bot review is never a merge gate: branch protection requires the fast
  # checks and both e2e lanes, and CodeRabbit must not block a merge that CI passed.
  request_changes_workflow: false

  poem: false
  in_progress_fortune: false

  # The summary goes in the walkthrough comment, never in the PR description — the bot does not
  # get to rewrite the author's PR body.
  high_level_summary: true
  high_level_summary_in_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    # CodeRabbit counts a review per PUSH, not per PR, and the OSS allowance is a rolling per-hour
    # budget — so incremental review spends it several times over on any PR that gets pushed twice.
    # The opening push is reviewed automatically; later ones on request with `@coderabbitai review`.
    auto_incremental_review: false
    # Reviews are a limited resource, so they are SPENT rather than spent by default: label a PR
    # `skip-coderabbit` when a human has already decided the diff is safe (mechanical, size-only,
    # a doc tweak) and a review would be noise. Removing the label puts it back in the queue.
    # Docs and release chores are skipped by title, because a review of prose is not a review and
    # release-please's PR is generated.
    labels:
      - '!skip-coderabbit'
    ignore_title_keywords:
      - 'docs:'
      - 'chore(main): release'

  # Compiled output, not source. scripts/build-web.mjs writes src/web/dist/** and the pre-commit
  # hook stages it; the .bundle.js files are bundles from the same pipeline. Plus the lockfile.
  # Generated bytes are not reviewable input, and they burn the OSS per-review file budget.
  path_filters:
    - '!src/web/dist/**'
    - '!src/web/panel.bundle.js'
    - '!src/web/accept.bundle.js'
    - '!src/web/share.bundle.js'
    - '!package-lock.json'

  pre_merge_checks:
    # This codebase deliberately carries no docstrings (AGENTS.md, "Comments: a paired doc is the
    # default"), so the default 80%-coverage warning would nag on every PR.
    docstrings:
      mode: off
    # CI's `pr-title` job already enforces the conventional-commit title release-please reads.
    title:
      mode: off
    description:
      mode: off

  tools:
    # `npm run lint` is `eslint src`, and eslint.config.mjs is deliberately minimal. Oxc and Biome
    # are NOT covered by repo tooling: they are off because each brings its own rule set — Biome a
    # formatter too — and that contradicts Prettier owning formatting and ESLint owning correctness.
    eslint:
      enabled: false
    oxc:
      enabled: false
    biome:
      enabled: false
    # No config exists in the repo for any of these, so their line-length and prose defaults apply,
    # and those fight docs that are deliberately wide tables and fragmentary bullets.
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false

  path_instructions:
    - path: 'src/**/*.ts'
      instructions: |
        AGENTS.md is the authority on this codebase and is already in your review context. Do not
        restate it, and do not propose anything that contradicts it.
        - CI already runs `npm run lint`, `npm run typecheck`, `npm run format:check` and
          `npm test`. Report nothing those four catch, and never comment on formatting.
        - Tests assert invariants, not literal strings.
        - Prefer flagging a name that needs a comment over suggesting the comment.
    - path: '**/*.md'
      instructions: |
        These docs are deliberately dense: bullets, tables and short declaratives, no narrative.
        Do not propose prose expansion or "fuller" explanations. Do flag a claim that names no
        real symbol, route or env var — an unverifiable claim is a defect here.
    - path: 'demo/**'
      instructions: |
        The mock rig is the only place tests run. Never suggest running the suite, or an
        experiment, against a real Immich server.
    - path: '.github/workflows/**'
      instructions: |
        Immich is pinned BY DIGEST on purpose — upstream mutates even version tags. Never suggest
        replacing a digest with a version tag.
